<app-header />
<main class="main">
  <div class="container">
    <div class="cards">
      @for (card of cards; track card.id) {
        <app-card
          [titlecard]="card.title"
          [iconUrl]="card.iconUrl"
          [amount]="card.amount"
          [variant]="card.variant"
        />
      }
    </div>
  </div>
</main>
